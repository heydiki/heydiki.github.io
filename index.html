<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTW HADIR</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.06), transparent 25%),
                #050505;
            z-index: -2;
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            z-index: -1;
        }

        /* Partikel */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: float linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(110vh);
            }
            to {
                transform: translateY(-10vh);
            }
        }

        /* Container */
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .content {
            max-width: 900px;
            animation: appear 1.2s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 3px;
            color: #aaa;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
        }

        .badge span {
            color: white;
        }

        /* Judul */
        h1 {
            font-size: clamp(65px, 13vw, 150px);
            line-height: 0.85;
            font-weight: 900;
            letter-spacing: -7px;
            text-transform: uppercase;

            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #eeeeee 45%,
                #555555 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 0 30px rgba(255,255,255,0.12));
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 15px rgba(255,255,255,0.08));
            }

            to {
                filter: drop-shadow(0 0 35px rgba(255,255,255,0.18));
            }
        }

        /* Subtitle */
        .subtitle {
            margin-top: 30px;
            font-size: clamp(18px, 3vw, 27px);
            color: #ddd;
            font-weight: 600;
        }

        .subtitle::before {
            content: "「";
            color: #666;
            margin-right: 8px;
        }

        .subtitle::after {
            content: "」";
            color: #666;
            margin-left: 8px;
        }

        /* Deskripsi */
        .description {
            margin: 15px auto 0;
            max-width: 550px;
            color: #777;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Loading */
        .loading {
            margin: 40px auto 0;
            width: min(350px, 80vw);
        }

        .loading-text {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .bar {
            width: 100%;
            height: 3px;
            background: #1b1b1b;
            overflow: hidden;
            border-radius: 10px;
        }

        .bar-inner {
            width: 0%;
            height: 100%;
            background: white;
            box-shadow: 0 0 15px white;
            transition: width 0.1s linear;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            h1 {
                letter-spacing: -4px;
            }

            .subtitle {
                margin-top: 25px;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="grid"></div>

    <div class="container">

        <main class="content">

            <div class="badge">
                <span>●</span> SOMETHING IS COMING
            </div>

            <h1>OTW<br>HADIR</h1>

            <div class="subtitle">
                Sek boss gurung dino e
            </div>

            <p class="description">
                Sing sabar sek, sing penting ojo ditunggu terus.
                Lagi dirampungno ben pas metu ora ngisin-ngisini.
            </p>

            <div class="loading">

                <div class="loading-text">
                    <span>PREPARING...</span>
                    <span id="percent">0%</span>
                </div>

                <div class="bar">
                    <div class="bar-inner" id="bar"></div>
                </div>

            </div>

        </main>

    </div>

    <footer>
        © 2026 — OTW HADIR
    </footer>


    <script>

        /* =========================
           LOADING ANIMATION
        ========================= */

        const bar = document.getElementById("bar");
        const percent = document.getElementById("percent");

        let progress = 0;

        function loading() {

            progress += Math.random() * 2;

            if (progress >= 100) {
                progress = 100;
            }

            bar.style.width = progress + "%";
            percent.textContent = Math.floor(progress) + "%";

            if (progress < 100) {
                setTimeout(loading, 100);
            } else {

                setTimeout(() => {
                    progress = 0;
                    loading();
                }, 1500);

            }
        }

        loading();


        /* =========================
           FLOATING PARTICLES
        ========================= */

        const particleCount = 35;

        for (let i = 0; i < particleCount; i++) {

            const particle = document.createElement("div");

            particle.classList.add("particle");

            particle.style.left = Math.random() * 100 + "%";

            particle.style.animationDuration =
                (Math.random() * 8 + 5) + "s";

            particle.style.animationDelay =
                Math.random() * 8 + "s";

            particle.style.opacity =
                Math.random() * 0.5;

            document.body.appendChild(particle);
        }


        /* =========================
           MOUSE PARALLAX
        ========================= */

        document.addEventListener("mousemove", (e) => {

            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;

            document.querySelector(".content").style.transform =
                `translate(${x}px, ${y}px)`;

        });

    </script>

</body>
</html>
